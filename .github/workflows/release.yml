name: Build and Release TelegramPV

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Tests y vet antes de compilar
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Generate Wails bindings
        shell: bash
        run: CGO_ENABLED=0 wails3 generate bindings -d dashboard/src/bindings

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: go vet
        run: CGO_ENABLED=0 go vet ./pkg/...

      - name: go test
        run: CGO_ENABLED=0 go test ./pkg/...

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Generate Wails bindings
        shell: bash
        run: wails3 generate bindings -d dashboard/src/bindings

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Build application with Wails
        shell: bash
        run: wails3 build

      - name: Package Windows
        shell: bash
        run: |
          mkdir -p dist_win
          BIN_PATH=""
          if [ -f "build/bin/TelegramPV.exe" ]; then
            BIN_PATH="build/bin/TelegramPV.exe"
          elif [ -f "build/bin/TelegramPV" ]; then
            BIN_PATH="build/bin/TelegramPV"
          elif [ -f "build/bin/tgpv.exe" ]; then
            BIN_PATH="build/bin/tgpv.exe"
          else
            echo "Error: Binary not found in build/bin"
            ls -la build/bin
            exit 1
          fi
          cp "$BIN_PATH" dist_win/TelegramPV.exe
          powershell -NoProfile -NonInteractive -Command "Compress-Archive -Path 'dist_win/*' -DestinationPath 'TelegramPV-Windows-${{ github.ref_name }}.zip' -Force"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: TelegramPV-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux x86_64
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Install Wails CLI
        shell: bash
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Generate Wails bindings
        shell: bash
        run: CGO_ENABLED=0 wails3 generate bindings -d dashboard/src/bindings

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Build application with Wails
        shell: bash
        run: wails3 build

      - name: Package Linux
        shell: bash
        run: tar -czf "TelegramPV-Linux-x86_64-${{ github.ref_name }}.tar.gz" -C build/bin TelegramPV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux x86_64
          path: TelegramPV-Linux-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build macOS Universal
    needs: test
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Generate Wails bindings
        shell: bash
        run: CGO_ENABLED=0 wails3 generate bindings -d dashboard/src/bindings

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Update macOS version in Info.plist
        shell: bash
        run: |
          RAW_VERSION="${{ github.ref_name }}"
          VERSION="${RAW_VERSION#v}"
          echo "Setting macOS version to: $VERSION"
          if [ -f "build/darwin/Info.plist" ]; then
            plutil -replace CFBundleVersion -string "$VERSION" build/darwin/Info.plist || true
            plutil -replace CFBundleShortVersionString -string "$VERSION" build/darwin/Info.plist || true
          fi
          if [ -f "build/darwin/Info.dev.plist" ]; then
            plutil -replace CFBundleVersion -string "$VERSION" build/darwin/Info.dev.plist || true
            plutil -replace CFBundleShortVersionString -string "$VERSION" build/darwin/Info.dev.plist || true
          fi

      - name: Build application (Sequential Universal Binary)
        shell: bash
        run: |
          mkdir -p build/bin
          
          echo "Compilando arquitectura amd64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags purego,production -trimpath -buildvcs=false -ldflags="-w -s" -o build/bin/TelegramPV-amd64
          
          echo "Compilando arquitectura arm64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags purego,production -trimpath -buildvcs=false -ldflags="-w -s" -o build/bin/TelegramPV-arm64
          
          echo "Uniendo arquitecturas en binario Universal con lipo..."
          lipo -create -output build/bin/TelegramPV build/bin/TelegramPV-amd64 build/bin/TelegramPV-arm64
          rm -f build/bin/TelegramPV-amd64 build/bin/TelegramPV-arm64
          
          APP_DIR="build/bin/TelegramPV.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          if [ -f "build/bin/TelegramPV" ]; then
            mv "build/bin/TelegramPV" "$APP_DIR/Contents/MacOS/TelegramPV"
          fi
          
          if [ -f "build/darwin/Info.plist" ]; then
            cp "build/darwin/Info.plist" "$APP_DIR/Contents/Info.plist"
          fi
          
          if [ -f "build/darwin/icons.icns" ]; then
            cp "build/darwin/icons.icns" "$APP_DIR/Contents/Resources/icons.icns"
          fi
          
          if [ -f "$APP_DIR/Contents/MacOS/TelegramPV" ]; then
            chmod +x "$APP_DIR/Contents/MacOS/TelegramPV"
          fi

          codesign --force --deep --sign - "$APP_DIR" || true

      - name: Package macOS
        shell: bash
        run: |
          if [ -d "build/bin/TelegramPV.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent build/bin/TelegramPV.app "TelegramPV-macOS-Universal-${{ github.ref_name }}.zip"
          else
            cd build/bin && zip -r "../../TelegramPV-macOS-Universal-${{ github.ref_name }}.zip" . && cd ../..
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS Universal
          path: TelegramPV-macOS-Universal-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release_assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            🚀 <b>¡Nueva versión de TelegramPV publicada!</b>

            📦 <b>Versión:</b> <code>${{ github.ref_name }}</code>
            🔗 <b>Enlace:</b> https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      - name: Delete temporary build artifacts (Zero Retention)
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const res = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of res.data.artifacts) {
              console.log(`Eliminando artefacto temporal: ${artifact.name} (ID: ${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
